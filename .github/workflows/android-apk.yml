name: EM PHOTO PRO - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: EM-PHOTO-PRO-Android
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
